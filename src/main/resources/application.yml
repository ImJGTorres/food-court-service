server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/foodcourt?createDatabaseIfNotExist=true
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    openfeign:
      client:
        config:
          messaging-service:
            connect-timeout: 2000
            read-timeout: 10000

users-service:
  url: http://localhost:8081

messaging-service:
  url: http://localhost:8083

jwt:
  secret: ${JWT_SECRET}

appDescription: "Pragma Powerup - Food Court"
appVersion: "1.0.0"
